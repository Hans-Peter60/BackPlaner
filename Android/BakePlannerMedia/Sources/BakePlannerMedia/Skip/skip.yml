# Skip configuration for the BakePlannerMedia module: transpiled to Kotlin,
# its public API bridged to the app's native Swift.
skip:
  bridging: true

# The FileProvider that hands files to other apps lives in androidx.core;
# ExifInterface reads the orientation of camera photos (ImageScaler).
build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("androidx.core:core-ktx:1.13.1")'
        - 'implementation("androidx.exifinterface:exifinterface:1.3.7")'
